name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1, Node.js 24
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        shell: pwsh
        run: |
          $package = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $expectedTag = "v$($package.packages[0].version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $expectedTag"
          }
          $installerTemplate = Get-Content -Raw install.ps1
          $releaseInstaller = $installerTemplate -replace '(?m)^\$version\s*=\s*"[^"]+"\s*$', ('$version = "' + $expectedTag + '"')
          [IO.File]::WriteAllText("install.ps1", $releaseInstaller, [Text.UTF8Encoding]::new($false))
          Copy-Item target/release/envfind.exe envfind-x86_64-pc-windows-msvc.exe
          $binaryHash = (Get-FileHash -Algorithm SHA256 envfind-x86_64-pc-windows-msvc.exe).Hash.ToLowerInvariant()
          "$binaryHash  envfind-x86_64-pc-windows-msvc.exe" | Set-Content SHA256SUMS
          $installerHash = (Get-FileHash -Algorithm SHA256 install.ps1).Hash.ToLowerInvariant()
          "$installerHash  install.ps1" | Set-Content install.ps1.sha256

      - name: Attest release binary provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: envfind-x86_64-pc-windows-msvc.exe

      - name: Attest release installer script provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: install.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-assets
          path: |
            envfind-x86_64-pc-windows-msvc.exe
            SHA256SUMS
            install.ps1
            install.ps1.sha256

  publish:
    needs: build-windows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-assets
          path: dist

      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
